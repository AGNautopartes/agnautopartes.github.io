<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGN Autopartes — Panel ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-shared.css">
    <style>
        /* Estilos específicos de la página de pedidos (Badges de estado) */
        .order-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .order-card:hover,
        .order-card.selected {
            border-color: var(--blue);
            background: var(--surface2);
        }

        .order-client {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .order-part {
            color: var(--text2);
            font-size: 0.8rem;
        }

        .order-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
        }

        .sbadge {
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid transparent;
        }

        .s-solicitado {
            background: rgba(107, 114, 128, 0.2);
            color: #9CA3AF;
        }

        .s-comprado {
            background: rgba(245, 158, 11, 0.15);
            color: var(--yellow);
        }

        .s-entregado {
            background: rgba(34, 197, 94, 0.15);
            color: var(--green);
        }

        .detail-panel {
            width: 380px;
            border-left: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        .detail-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .detail-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Aria Chat Sidebar */
        .ai-sidebar {
            width: var(--sidebar-w);
            border-left: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .ai-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .aria-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7B2FBE, #4F8EF7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .ai-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .ai-msg {
            max-width: 90%;
            padding: 0.6rem 0.85rem;
            border-radius: 12px;
            font-size: 0.82rem;
        }

        .ai-msg.user {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            align-self: flex-end;
        }

        .ai-msg.assistant {
            background: var(--surface2);
            color: var(--text);
            align-self: flex-start;
            border: 1px solid var(--border);
        }

        .ai-input-area {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>

<body>
    <!-- Login Screen persists in HTML to avoid flashes, managed by admin-core.js -->
    <div id="login-screen" style="display:none;">
        <div class="login-card">
            <div class="login-logo"><span>AGN</span></div>
            <div class="login-subtitle">Panel ERP Administrativo</div>
            <div class="field"><label>Nombre</label><input type="text" id="login-name"></div>
            <div class="field"><label>Contraseña</label><input type="password" id="login-pass"></div>
            <button class="btn-primary" id="btn-login" onclick="performLogin()">Ingresar</button>
            <div class="login-error" id="login-err"></div>
        </div>
    </div>

    <!-- Main APP Structure -->
    <div id="app" style="display:none;">
        <nav>
            <div class="nav-brand"><span>AGN</span> ERP</div>
            <div class="nav-tabs">
                <a href="admin.html" class="tab-btn active" data-page="orders">📋 Órdenes</a>
                <a href="admin-dashboard.html" class="tab-btn" data-page="dashboard">📊 Dashboard</a>
                <a href="admin-reportes.html" class="tab-btn" data-page="reports">📈 Reportes</a>
            </div>
            <div class="nav-right">
                <span class="pill" id="nav-active">0 activas</span>
                <span style="font-size:0.8rem;color:var(--text2)" id="nav-user"></span>
                <button class="btn-sm" id="btn-logout">Salir</button>
            </div>
        </nav>

        <div class="app-body">
            <div class="page active" id="page-orders">
                <div class="orders-main" style="flex:1; display:flex; flex-direction:column;">
                    <div class="stats-bar">
                        <div class="stat-item">
                            <div class="n" id="s-total">—</div>
                            <div class="l">Total</div>
                        </div>
                        <div class="stat-item">
                            <div class="n" style="color:var(--yellow)" id="s-comprado">—</div>
                            <div class="l">Comprado</div>
                        </div>
                        <div class="stat-item">
                            <div class="n" style="color:var(--purple)" id="s-transito">—</div>
                            <div class="l">Tránsito</div>
                        </div>
                        <div class="stat-item">
                            <div class="n" style="color:var(--green)" id="s-entregado">—</div>
                            <div class="l">Entregado</div>
                        </div>
                    </div>

                    <div class="orders-toolbar" style="padding:1rem; display:flex; gap:1rem;">
                        <input type="text" class="search-box" id="search-input" placeholder="🔍 Buscar..."
                            style="flex:1;">
                        <select id="status-filter"
                            style="padding:0.5rem; border-radius:8px; background:var(--surface2); color:white; border:1px solid var(--border);">
                            <option value="">Estados</option>
                            <option>Solicitado</option>
                            <option>Comprado</option>
                            <option>Entregado</option>
                        </select>
                        <button class="btn-primary" id="btn-new-order" style="padding:0.5rem 1rem;">+ Nueva
                            Orden</button>
                    </div>

                    <div id="orders-list" style="flex:1; overflow-y:auto; padding:1rem;">
                        <div class="empty-state">Iniciando sistema...</div>
                    </div>
                </div>

                <!-- Order Detail Panel -->
                <div class="detail-panel empty" id="detail-panel">
                    <div id="detail-content"
                        style="flex:1; display:flex; align-items:center; justify-content:center; color:var(--text2)">
                        <span>← Selecciona una orden</span>
                    </div>
                </div>

                <!-- Aria Chat Sidebar -->
                <div class="ai-sidebar">
                    <div class="ai-header">
                        <div class="aria-avatar">A</div>
                        <div>
                            <div class="ai-title">Aria AI</div>
                            <div class="ai-subtitle">Asistente Inteligente</div>
                        </div>
                    </div>
                    <div class="ai-messages" id="ai-messages"></div>
                    <div class="ai-input-area">
                        <textarea class="ai-input" id="aria-input" placeholder="Pregúntame algo..." rows="1"></textarea>
                        <button class="ai-send" id="aria-send">Enviar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Injected via Modular Pattern -->
    <script src="admin-core.js"></script>
    <script src="admin.js"></script>
    <script src="admin-chat.js"></script>
    <script>
        async function performLogin() {
            const pass = document.getElementById('login-pass').value;
            const name = document.getElementById('login-name').value || 'Admin';

            if (pass) {
                localStorage.setItem('agn_admin_pass', pass);
                localStorage.setItem('agn_admin_name', name);

                // Actualizar variables globales en window.AGN_CORE
                window.AGN_CORE.adminPass = pass;
                window.AGN_CORE.adminName = name;

                // Mostrar la app sin recargar (o podemos recargar para limpiar estado)
                window.AGN_CORE.showApp();
                // Opcional: recargar para asegurar que admin.js re-ejecute loadOrders con el nuevo pass
                window.location.reload();
            } else {
                document.getElementById('login-err').textContent = "Contraseña requerida";
            }
        }
    </script>
</body>

</html>
